<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 1082" width="680" height="1082"
     font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" role="img">
  <title>作品集站生成流程</title>
  <desc>六阶段：确认三件事 → 建站 → 内容校准 → 补图片 → 打包 → 上线。含老站迭代、体检不过回改、发布三条旁支。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="1082" fill="#FDFDFC"/>

  <rect x="110" y="30" width="240" height="44" rx="22" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="230" y="52" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">要做一份作品集站</text>
  <path d="M230 74 L230 102" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

  <path d="M230 106 L350 152 L230 198 L110 152 Z" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="230" y="152" text-anchor="middle" dominant-baseline="central" font-size="13.5" font-weight="500" fill="#412402">已有站点？</text>
  <path d="M350 152 L396 152" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="370" y="142" text-anchor="middle" font-size="11.5" fill="#5F5E5A">是</text>
  <rect x="400" y="126" width="240" height="52" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 3"/>
  <text x="520" y="145" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="500" fill="#2C2C2A">迭代：直接开后台改</text>
  <text x="520" y="163" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#5F5E5A">改完重新生成即可</text>
  <path d="M520 178 L520 466 L354 466" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <path d="M230 198 L230 226" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="242" y="214" font-size="11.5" fill="#5F5E5A">否</text>

  <rect x="110" y="230" width="240" height="64" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="230" y="256" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">① 确认三件事</text>
  <text x="230" y="277" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#185FA5">给谁做 · 素材 · 要不要后台</text>
  <path d="M230 294 L230 322" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="110" y="326" width="240" height="88" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="230" y="350" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">② setup_site.py 建站</text>
  <text x="230" y="373" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#185FA5">有简历 --resume ｜ 没有 --demo</text>
  <text x="230" y="395" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#5F5E5A">内部 [1/5] 读简历 → [5/5] 验收提示</text>
  <path d="M230 414 L230 442" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="110" y="446" width="240" height="64" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="230" y="472" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">③ 后台改内容 → 点生成</text>
  <text x="230" y="493" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#185FA5">每改一次看一次效果</text>
  <path d="M230 510 L230 538" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

  <path d="M230 542 L330 582 L230 622 L130 582 Z" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="230" y="582" text-anchor="middle" dominant-baseline="central" font-size="13.5" font-weight="500" fill="#412402">体检通过？</text>
  <path d="M330 582 L396 582" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="358" y="572" text-anchor="middle" font-size="11.5" fill="#5F5E5A">否</text>
  <rect x="400" y="556" width="240" height="52" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 3"/>
  <text x="520" y="575" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="500" fill="#2C2C2A">按提示改 data.json 对应键</text>
  <text x="520" y="593" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#5F5E5A">体检会指名第几条</text>
  <path d="M600 556 L600 494 L354 494" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <path d="M230 622 L230 650" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="242" y="638" font-size="11.5" fill="#5F5E5A">是</text>

  <rect x="110" y="654" width="240" height="64" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="230" y="680" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">④ 补图片（可选）</text>
  <text x="230" y="701" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#185FA5">复用摄影 ｜ 生图 ｜ 先留占位</text>
  <path d="M230 718 L230 746" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="110" y="750" width="240" height="64" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="230" y="776" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">⑤ deploy_site.py 打包</text>
  <text x="230" y="797" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#185FA5">先问形式：html / zip / both</text>
  <path d="M230 814 L230 842" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

  <path d="M230 846 L330 886 L230 926 L130 886 Z" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="230" y="886" text-anchor="middle" dominant-baseline="central" font-size="13.5" font-weight="500" fill="#412402">要发布上线？</text>
  <path d="M330 886 L396 886" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="358" y="876" text-anchor="middle" font-size="11.5" fill="#5F5E5A">要</text>
  <rect x="400" y="856" width="240" height="62" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 3"/>
  <text x="520" y="877" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="500" fill="#2C2C2A">⑥ 上线（可选）</text>
  <text x="520" y="896" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#5F5E5A">WorkBuddy / GitHub / Netlify / 自有服务器</text>
  <path d="M230 926 L230 954" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="242" y="942" font-size="11.5" fill="#5F5E5A">不要</text>

  <rect x="110" y="958" width="240" height="44" rx="22" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="230" y="980" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">交付物在 _deploy/</text>

  <line x1="40" y1="1026" x2="640" y2="1026" stroke="#D3D1C7" stroke-width="0.5"/>
  <rect x="40" y="1042" width="22" height="14" rx="7" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="70" y="1049" dominant-baseline="central" font-size="11.5" fill="#5F5E5A">起止</text>
  <rect x="130" y="1042" width="22" height="14" rx="3" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="160" y="1049" dominant-baseline="central" font-size="11.5" fill="#5F5E5A">步骤</text>
  <path d="M250 1049 L264 1038 L278 1049 L264 1060 Z" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="286" y="1049" dominant-baseline="central" font-size="11.5" fill="#5F5E5A">判断</text>
  <rect x="356" y="1042" width="22" height="14" rx="3" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 2"/>
  <text x="386" y="1049" dominant-baseline="central" font-size="11.5" fill="#5F5E5A">旁支 / 可选</text>
</svg>
